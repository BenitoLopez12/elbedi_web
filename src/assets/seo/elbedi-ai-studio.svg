<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ELBEDI, inteligencia artificial para empresas</title>
  <desc id="description">Composición de marca en azul, violeta y rosa con un sistema orbital de agentes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#281027"/>
      <stop offset="0.48" stop-color="#171433"/>
      <stop offset="1" stop-color="#09162e"/>
    </linearGradient>
    <radialGradient id="core" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.13" stop-color="#ffe1a7"/>
      <stop offset="0.42" stop-color="#ff8bbd"/>
      <stop offset="1" stop-color="#6a37cf"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc9e4"/>
      <stop offset="0.48" stop-color="#c9bbff"/>
      <stop offset="1" stop-color="#afe9ff"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1030" cy="-40" r="360" fill="#3059e3" opacity="0.2"/>
  <circle cx="60" cy="640" r="380" fill="#d63391" opacity="0.19"/>
  <g fill="#fff" opacity="0.55">
    <circle cx="83" cy="93" r="2"/><circle cx="197" cy="158" r="1.5"/><circle cx="402" cy="80" r="1"/>
    <circle cx="547" cy="137" r="1.5"/><circle cx="1058" cy="114" r="1.5"/><circle cx="1127" cy="502" r="2"/>
    <circle cx="936" cy="548" r="1"/><circle cx="724" cy="92" r="1"/><circle cx="63" cy="430" r="1.5"/>
  </g>
  <g transform="translate(865 315)">
    <ellipse rx="272" ry="106" fill="none" stroke="#a9dfff" stroke-width="2" opacity="0.25" transform="rotate(-14)"/>
    <ellipse rx="217" ry="78" fill="none" stroke="#ffafd4" stroke-width="2" opacity="0.24" transform="rotate(16)"/>
    <ellipse rx="153" ry="54" fill="none" stroke="#ffe3a1" stroke-width="2" opacity="0.22" transform="rotate(-25)"/>
    <circle r="78" fill="#ff98c7" opacity="0.18" filter="url(#glow)"/>
    <circle r="62" fill="url(#core)"/>
    <circle cx="-203" cy="-58" r="23" fill="#a8e5ff"/>
    <circle cx="183" cy="62" r="31" fill="#b99cff"/>
    <circle cx="-90" cy="-61" r="15" fill="#ffe5a4"/>
    <circle cx="96" cy="-87" r="19" fill="#ff9ecf"/>
    <circle cx="246" cy="-23" r="13" fill="#85c7ff"/>
    <g fill="#fff" opacity="0.9">
      <circle cx="-216" cy="-66" r="3"/><circle cx="171" cy="51" r="4"/><circle cx="88" cy="-94" r="3"/>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff">
    <text x="74" y="102" font-size="22" font-weight="700" letter-spacing="7">ELBEDI</text>
    <text x="74" y="177" font-size="17" font-weight="700" letter-spacing="3" opacity="0.7">ESTUDIO DE IA · MÉXICO</text>
    <text x="70" y="286" font-size="62" font-weight="700">Diseñamos la</text>
    <text x="70" y="357" font-size="62" font-weight="700" fill="url(#word)">inteligencia</text>
    <text x="70" y="428" font-size="62" font-weight="700">de tu negocio.</text>
    <text x="74" y="506" font-size="21" opacity="0.72">Agentes · Sistemas agénticos · Analítica · Sitios inteligentes</text>
    <text x="74" y="559" font-size="17" font-weight="700" letter-spacing="2" opacity="0.8">ELBEDI.COM</text>
  </g>
</svg>
